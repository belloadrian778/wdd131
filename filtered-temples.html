
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore temples of The Church of Jesus Christ of Latter-day Saints and filter them by dedication date and size.">
    <meta name="author" content="Adrian Bello">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <title>Filtered Temple Album</title>

    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="stylesheet" href="styles/filtered-temples-large.css">

    <script src="scripts/filtered-temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>

        <button id="menu" type="button"
                aria-label="Toggle navigation"
                aria-expanded="false">☰</button>

        <nav id="navigation" aria-label="Temple filters">
            <ul>
                <li><a href="#" id="home">Home</a></li>
                <li><a href="#" id="old">Old</a></li>
                <li><a href="#" id="new">New</a></li>
                <li><a href="#" id="large">Large</a></li>
                <li><a href="#" id="small">Small</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2 id="page-title">Home</h2>

        <div class="gallery" id="temple-cards">
            <!-- Temple cards will be created by JavaScript -->
        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            | Adrian Bello | Utah
        </p>
        <p id="lastModified"></p>
    </footer>

</html>
